# Build and test the Kokuin Ledger app with Speculos emulator.
#
# Automated:
#   ./apps/ledger/test.sh             # Build + emulator + tests + teardown
#
# Manual:
#   docker compose run --rm build     # Build only
#   docker compose up -d speculos     # Start Speculos (after build)
#   docker compose down               # Stop everything
#
# Speculos exposes:
#   - Port 5000: REST API (APDU exchange, button simulation, screenshots)
#   - Port 40000: Raw TCP APDU port

services:
  build:
    image: ghcr.io/ledgerhq/ledger-app-builder/ledger-app-builder:latest
    volumes:
      - .:/app
    working_dir: /app
    # The BOLOS SDK enumerates app sources via `git ls-files`, so the build
    # needs a git repo. The bind mount only holds apps/ledger (the repo .git is
    # above the mount), and we don't want to write a nested .git or build/
    # artifacts back onto the host. So build inside a container-local copy with
    # a throwaway git repo, then copy just the ELF back to the mounted bin/.
    command: >
      bash -c "rm -rf /tmp/build && cp -a /app /tmp/build && cd /tmp/build &&
      git init -q && git add -A &&
      BOLOS_SDK=$$NANOSP_SDK COIN=KOK make clean &&
      BOLOS_SDK=$$NANOSP_SDK COIN=KOK make &&
      mkdir -p /app/bin && cp /tmp/build/bin/app.elf /app/bin/app.elf"

  speculos:
    image: ghcr.io/ledgerhq/speculos
    volumes:
      - .:/app
    ports:
      - "${SPECULOS_PORT:-9999}:5000"
      - "40000:40000"
    command: >
      /app/bin/app.elf
      --model nanosp
      --seed "abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon about"
      --apdu-port 40000
      --api-port 5000
      --display headless
