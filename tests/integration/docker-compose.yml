# Local Postgres for repeated integration runs (see README.md).
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_PASSWORD: kokuin
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 1s
      timeout: 5s
      retries: 30
