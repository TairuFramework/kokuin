[workspace]
members = ["crates/kokuin-crypto", "crates/kokuin-crypto-ffi"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
blake3 = "=1.8.7"
curve25519-dalek = "=5.0.0"
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["fast", "zeroize"] }
p256 = { version = "=0.14.0", default-features = false, features = ["ecdsa", "sha256"] }
zeroize = "=1.9.0"
hex = "=0.4.3"
serde_json = "=1.0.154"
sha2 = { version = "=0.11.1", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1

