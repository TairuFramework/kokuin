name: Rust crypto checks
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  crypto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
      - name: Install dependencies and pinned Rust toolchain
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check Rust formatting
        run: pnpm exec cargo fmt --all --check
      - name: Test crypto core and C ABI
        run: pnpm exec cargo test --workspace --locked --offline
      - name: Check Rust warnings
        run: pnpm exec cargo clippy --workspace --all-targets --locked --offline -- -D warnings
      - name: Check native ownership with sanitizers
        run: node scripts/test-crypto-native.mjs
      - name: Test artifact freshness
        run: node --test scripts/crypto-artifacts.test.mjs
      - name: Check generated C header
        run: git diff --exit-code -- packages/crypto-native/cpp/generated/kokuin_crypto.h
