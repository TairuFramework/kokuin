name: Desktop E2E
on:
  push:
    branches: [main]
  pull_request:
env:
  CI: true
  DO_NOT_TRACK: 1
jobs:
  test:
    name: on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup environment
        uses: TairuFramework/kigu/setup@main
        with:
          node-version: 24

      - name: Cache electron binary
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Fetch electron binary
        run: pnpm rebuild electron

      - name: Package app
        working-directory: tests/e2e-electron
        run: pnpm run package

      - name: Run tests
        working-directory: tests/e2e-electron
        run: pnpm run test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.os }}
          path: tests/e2e-electron/playwright-report/

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-${{ matrix.os }}
          path: tests/e2e-electron/test-results/
