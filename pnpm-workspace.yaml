packages:
  - packages/*
  - tests/*

blockExoticSubdeps: false

allowBuilds:
  '@swc/core': true
  electron: false
  esbuild: false

nodeLinker: hoisted

versioning:
  changelog:
    storage: repository
  # Private packages are never released. They must be listed by exact name --
  # `versioning.ignore` does not accept globs, and leaving one out makes
  # `pnpm change status` / `pnpm version -r` fail once a bump has to propagate
  # into it.
  ignore:
    - '@kokuin/keystore-conformance'
    - '@kokuin/ledger-tests'
    - e2e-electron
    - e2e-expo
    - e2e-node
    - e2e-web

catalog:
  '@electron-forge/cli': ^7.11.2
  '@electron-forge/plugin-vite': ^7.11.2
  '@opentelemetry/api': ^1.9.1
  '@opentelemetry/sdk-trace-base': ^2.10.0
  '@opentelemetry/sdk-trace-node': ^2.10.0
  '@sozai/async': ^0.2.1
  '@sozai/codec': ^0.4.0
  '@sozai/lock': ^0.1.0
  '@sozai/log': ^0.3.1
  '@sozai/otel': ^0.3.2
  '@sozai/runtime-expo': ^0.2.2
  '@sozai/schema': ^0.1.1
  '@napi-rs/keyring': ^1.3.0
  '@noble/ciphers': ^2.1.1
  '@noble/curves': ^2.3.0
  '@noble/hashes': ^2.3.0
  '@playwright/test': 1.62.1
  '@scure/base': ^2.2.0
  '@scure/bip39': ^2.2.0
  '@types/node': ^26.1.2
  '@types/react': ^19.2.18
  '@types/react-dom': ^19.2.4
  '@vitejs/plugin-react': ^6.0.5
  electron: ^43.3.0
  electron-store: ^11.0.2
  expo: ^57.0.11
  expo-crypto: ^57.0.1
  expo-secure-store: ^57.0.1
  expo-status-bar: ^57.0.1
  micro-key-producer: ^0.9.0
  react: 19.2.3
  react-dom: 19.2.3
  react-native: 0.86.0
  react-native-web: 0.21.2
  typescript: ^6.0.3
  uint8arrays: ^6.1.1
  vite: ^8.2.1
  '@kigu/dev': ^0.2.1

catalogMode: prefer

overrides:
  # extract-zip 2.0.1 (via @electron/packager) pulls yauzl 2.10.0, whose
  # extraction lets Node exit 0 mid-package on some runtimes (node 24.17, 26).
  # yauzl 3.x keeps the event loop alive through extraction. See e2e-desktop.
  yauzl: ^3.4.0

minimumReleaseAgeExclude:
  - '@kigu/*'
  - '@sozai/*'
  - '@expo/cli@57.0.2'
  - '@expo/fingerprint@0.20.1'
  - '@expo/inline-modules@0.1.1'
  - '@expo/local-build-cache-provider@57.0.1'
  - '@expo/metro-config@57.0.2'
  - '@expo/prebuild-config@57.0.2'
  - '@expo/router-server@57.0.1'
  - babel-preset-expo@57.0.1
  - expo-asset@57.0.2
  - expo-constants@57.0.2
  - expo-modules-autolinking@57.0.2
  - expo@57.0.0

supportedArchitectures:
  cpu: [ current ]
  os: [ current ]
