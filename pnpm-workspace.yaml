packages:
  - packages/*
  - tests/*

blockExoticSubdeps: false

cargo:
  enabled: true

allowBuilds:
  '@swc/core': true
  cpu-features: false
  electron: false
  esbuild: false
  protobufjs: false
  ssh2: false

nodeLinker: hoisted

versioning:
  changelog:
    storage: repository
  # Private packages are never released. They must be listed by exact name --
  # `versioning.ignore` does not accept globs, and leaving one out makes
  # `pnpm change status` / `pnpm version -r` fail once a bump has to propagate
  # into it.
  ignore:
    - '@kokuin/crypto-conformance'
    - '@kokuin/controller-conformance'
    - '@kokuin/keystore-conformance'
    - '@kokuin/ledger-tests'
    - e2e-electron
    - e2e-expo
    - e2e-node
    - e2e-web
    - integration-tests

catalog:
  '@electron-forge/cli': ^8.0.1
  '@electron-forge/plugin-vite': ^8.0.1
  '@hozon/adapter': ^0.3.0
  '@hozon/db': ^0.5.1
  '@hozon/node-sqlite': ^0.3.0
  '@hozon/postgres': ^0.2.1
  '@opentelemetry/api': ^1.10.0
  '@opentelemetry/sdk-trace': ^3.0.0
  '@sozai/async': ^0.4.3
  '@sozai/codec': ^0.4.4
  '@sozai/hlc': ^0.1.0
  '@sozai/json': ^0.3.0
  '@sozai/lock': ^0.1.2
  '@sozai/log': ^0.4.0
  '@sozai/otel': ^0.4.0
  '@sozai/runtime': ^0.1.0
  '@sozai/runtime-expo': ^0.3.0
  '@sozai/schema': ^0.1.6
  '@napi-rs/keyring': ^2.1.2
  '@noble/ciphers': ^2.4.0
  '@noble/curves': ^2.4.0
  '@noble/hashes': ^2.4.0
  '@playwright/test': 1.64.1
  '@scure/base': ^2.4.0
  '@scure/bip39': ^2.4.0
  '@testcontainers/postgresql': ^12.2.1
  '@types/node': ^26.6.6
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@vitejs/plugin-react': ^6.2.1
  electron: ^45.2.2
  electron-store: ^12.0.0
  expo: ^58.0.23
  expo-crypto: ^58.0.7
  expo-file-system: ~58.0.10
  expo-sharing: ~58.0.22
  expo-secure-store: ^58.0.2
  expo-status-bar: ^58.0.4
  kysely: ^0.29.8
  micro-key-producer: ^0.10.2
  postgres: ^3.4.8
  react: 19.3.0
  react-dom: 19.3.0
  react-native: 0.88.1
  react-native-web: 0.21.4
  typescript: ^6.0.3
  uint8arrays: ^6.1.1
  vite: ^8.3.5
  '@kigu/dev': ^0.3.5
  nitrogen: 0.37.2
  react-native-nitro-modules: 0.37.2

catalogMode: prefer

minimumReleaseAgeExclude:
  - '@hozon/*'
  - '@kigu/*'
  - '@sozai/*'

supportedArchitectures:
  cpu: [ current ]
  os: [ current ]
