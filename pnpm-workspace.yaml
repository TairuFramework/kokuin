packages:
  - packages/*
  - tests/*

blockExoticSubdeps: false

allowBuilds:
  '@swc/core': true
  electron: false
  esbuild: false

nodeLinker: hoisted

catalog:
  '@electron-forge/cli': ^7.11.2
  '@electron-forge/plugin-vite': ^7.11.2
  '@opentelemetry/api': ^1.9.1
  '@opentelemetry/sdk-trace-base': ^2.8.0
  '@opentelemetry/sdk-trace-node': ^2.8.0
  '@sozai/async': ^0.1.0
  '@sozai/codec': ^0.1.0
  '@sozai/log': ^0.1.0
  '@sozai/otel': ^0.2.0
  '@sozai/runtime-expo': ^0.2.1
  '@sozai/schema': ^0.1.0
  '@napi-rs/keyring': ^1.3.0
  '@noble/ciphers': ^2.1.1
  '@noble/curves': ^2.0.1
  '@noble/hashes': ^2.0.0
  '@playwright/test': 1.61.1
  '@scure/base': ^2.2.0
  '@scure/bip39': ^2.2.0
  '@types/node': ^26.1.0
  '@types/react': ^19.2.17
  '@types/react-dom': ^19.2.3
  '@vitejs/plugin-react': ^6.0.3
  electron: ^43.0.0
  electron-store: ^11.0.2
  expo: ^57.0.1
  expo-crypto: ^57.0.0
  expo-secure-store: ^57.0.0
  expo-status-bar: ^57.0.0
  micro-key-producer: ^0.9.0
  react: 19.2.3
  react-dom: 19.2.3
  react-native: 0.86.0
  react-native-web: 0.21.2
  typescript: ^6.0.3
  uint8arrays: ^6.1.1
  vite: ^8.1.3

catalogMode: prefer

overrides:
  # extract-zip 2.0.1 (via @electron/packager) pulls yauzl 2.10.0, whose
  # extraction lets Node exit 0 mid-package on some runtimes (node 24.17, 26).
  # yauzl 3.x keeps the event loop alive through extraction. See e2e-desktop.
  yauzl: ^3.4.0

minimumReleaseAgeExclude:
  - '@kigu/*'
  - '@sozai/*'
  - '@expo/cli@57.0.2'
  - '@expo/fingerprint@0.20.1'
  - '@expo/inline-modules@0.1.1'
  - '@expo/local-build-cache-provider@57.0.1'
  - '@expo/metro-config@57.0.2'
  - '@expo/prebuild-config@57.0.2'
  - '@expo/router-server@57.0.1'
  - babel-preset-expo@57.0.1
  - expo-asset@57.0.2
  - expo-constants@57.0.2
  - expo-modules-autolinking@57.0.2
  - expo@57.0.0

supportedArchitectures:
  cpu: [ current ]
  os: [ current ]
