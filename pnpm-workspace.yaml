packages:
  - packages/*
  - tests/*

blockExoticSubdeps: false

allowBuilds:
  '@swc/core': true
  cpu-features: false
  electron: false
  esbuild: false
  protobufjs: false
  ssh2: false

nodeLinker: hoisted

versioning:
  changelog:
    storage: repository
  # Private packages are never released. They must be listed by exact name --
  # `versioning.ignore` does not accept globs, and leaving one out makes
  # `pnpm change status` / `pnpm version -r` fail once a bump has to propagate
  # into it.
  ignore:
    - '@kokuin/controller-conformance'
    - '@kokuin/keystore-conformance'
    - '@kokuin/ledger-tests'
    - e2e-electron
    - e2e-expo
    - e2e-node
    - e2e-web
    - integration-tests

catalog:
  '@electron-forge/cli': ^8.0.1
  '@electron-forge/plugin-vite': ^8.0.1
  '@hozon/adapter': ^0.2.1
  '@hozon/db': ^0.5.0
  '@hozon/node-sqlite': ^0.2.0
  '@hozon/postgres': ^0.2.0
  '@opentelemetry/api': ^1.10.0
  '@opentelemetry/sdk-trace': ^3.0.0
  '@sozai/async': ^0.4.3
  '@sozai/codec': ^0.4.3
  '@sozai/hlc': ^0.1.0
  '@sozai/json': ^0.3.0
  '@sozai/lock': ^0.1.2
  '@sozai/log': ^0.4.0
  '@sozai/otel': ^0.4.0
  '@sozai/runtime': ^0.1.0
  '@sozai/runtime-expo': ^0.3.0
  '@sozai/schema': ^0.1.6
  '@napi-rs/keyring': ^2.1.2
  '@noble/ciphers': ^2.4.0
  '@noble/curves': ^2.4.0
  '@noble/hashes': ^2.4.0
  '@playwright/test': 1.64.1
  '@scure/base': ^2.4.0
  '@scure/bip39': ^2.4.0
  '@testcontainers/postgresql': ^12.2.1
  '@types/node': ^26.6.5
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@vitejs/plugin-react': ^6.1.2
  electron: ^45.0.0
  electron-store: ^12.0.0
  expo: ^58.0.19
  expo-crypto: ^58.0.7
  expo-secure-store: ^58.0.2
  expo-status-bar: ^58.0.4
  kysely: ^0.29.7
  micro-key-producer: ^0.10.2
  postgres: ^3.4.8
  react: 19.3.0
  react-dom: 19.3.0
  react-native: 0.88.0
  react-native-web: 0.21.4
  typescript: ^6.0.3
  uint8arrays: ^6.1.1
  vite: ^8.3.5
  '@kigu/dev': ^0.3.4

catalogMode: prefer

overrides:
  # extract-zip 2.0.1 (via @electron/packager) pulls yauzl 2.10.0, whose
  # extraction lets Node exit 0 mid-package on some runtimes (node 24.17, 26).
  # yauzl 3.x keeps the event loop alive through extraction. See e2e-desktop.
  yauzl: ^3.4.0

minimumReleaseAgeExclude:
  - '@hozon/*'
  - '@kigu/*'
  - '@sozai/*'
  - '@expo/cli@57.0.2'
  - '@expo/fingerprint@0.20.1'
  - '@expo/inline-modules@0.1.1'
  - '@expo/local-build-cache-provider@57.0.1'
  - '@expo/metro-config@57.0.2'
  - '@expo/prebuild-config@57.0.2'
  - '@expo/router-server@57.0.1'
  - babel-preset-expo@57.0.1
  - expo-asset@57.0.2
  - expo-constants@57.0.2
  - expo-modules-autolinking@57.0.2
  - expo@57.0.0

supportedArchitectures:
  cpu: [ current ]
  os: [ current ]
