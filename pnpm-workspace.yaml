packages:
  - packages/*

allowBuilds:
  '@swc/core': true
  esbuild: false

nodeLinker: hoisted

catalog:
  '@napi-rs/keyring': ^1.3.0
  '@noble/ciphers': ^2.1.1
  '@noble/curves': ^2.0.1
  '@noble/hashes': ^2.0.0
  '@scure/base': ^2.2.0
  '@scure/bip39': ^2.2.0
  'electron': ^42.4.1
  'electron-store': ^11.0.2
  'expo-crypto': ^56.0.4
  'expo-secure-store': ^56.0.4
  'micro-key-producer': ^0.8.6
  'uint8arrays': ^6.1.1

minimumReleaseAgeExclude:
  - '@kigu/dev@0.1.0'
  - '@sozai/async@0.1.0'
  - '@sozai/codec@0.1.0'
  - '@sozai/log@0.1.0'
  - '@sozai/otel@0.1.0'
  - '@sozai/schema@0.1.0'
