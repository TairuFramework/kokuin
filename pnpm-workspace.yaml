packages:
  - packages/*
  - tests/*

allowBuilds:
  '@swc/core': true
  esbuild: false
  electron: false

nodeLinker: hoisted

catalog:
  '@napi-rs/keyring': ^1.3.0
  '@noble/ciphers': ^2.1.1
  '@noble/curves': ^2.0.1
  '@noble/hashes': ^2.0.0
  '@scure/base': ^2.2.0
  '@scure/bip39': ^2.2.0
  '@electron-forge/cli': ^7.11.2
  '@electron-forge/plugin-vite': ^7.11.2
  '@playwright/test': 1.61.0
  '@types/react': ^19.2.17
  '@types/react-dom': ^19.2.3
  '@vitejs/plugin-react': ^6.0.2
  'electron': ^42.4.1
  'electron-store': ^11.0.2
  react: 19.2.3
  react-dom: 19.2.3
  react-native-web: 0.21.2
  vite: ^8.0.16
  'expo-crypto': ^56.0.4
  'expo-secure-store': ^56.0.4
  'micro-key-producer': ^0.8.6
  'uint8arrays': ^6.1.1

minimumReleaseAgeExclude:
  - '@kigu/dev@0.1.0'
  - '@sozai/async@0.1.0'
  - '@sozai/codec@0.1.0'
  - '@sozai/log@0.1.0'
  - '@sozai/otel@0.1.0'
  - '@sozai/schema@0.1.0'
