apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

def supportedArchitectures = ['arm64-v8a', 'x86_64']
def requestedArchitectures = rootProject.findProperty('reactNativeArchitectures')
def nativeArchitectures = requestedArchitectures
  ? requestedArchitectures.split(',').collect { it.trim() }.findAll { supportedArchitectures.contains(it) }
  : supportedArchitectures
if (nativeArchitectures.isEmpty()) {
  throw new GradleException('KokuinCrypto requires arm64-v8a or x86_64 in reactNativeArchitectures')
}

android {
  namespace 'com.kokuin.crypto'
  compileSdk rootProject.ext.compileSdkVersion
  ndkVersion rootProject.ext.ndkVersion
  defaultConfig {
    minSdk rootProject.ext.minSdkVersion
    targetSdk rootProject.ext.targetSdkVersion
    externalNativeBuild {
      cmake {
        cppFlags '-std=c++20 -fexceptions -frtti'
        arguments '-DANDROID_STL=c++_shared', '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
        abiFilters(*nativeArchitectures)
      }
    }
  }
  externalNativeBuild { cmake { path 'CMakeLists.txt' } }
  buildFeatures { prefab true }
}

dependencies {
  implementation 'com.facebook.react:react-android'
  implementation project(':react-native-nitro-modules')
}

apply from: '../nitrogen/generated/android/KokuinCrypto+autolinking.gradle'
